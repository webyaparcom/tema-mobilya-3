  .modulex-deger-vaat-manset-kunye .modulex-deger-vaat-manset-ust { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }

  .modulex-deger-vaat-manset-kunye .modulex-deger-vaat-manset-baslik { font-family: var(--mx-font-serif, var(--mx-font-heading, serif)); font-size: clamp(2.2rem, 5.4vw, 4.4rem); font-weight: 700; letter-spacing: -0.01em; }
  .modulex-deger-vaat-manset-kunye .modulex-deger-vaat-manset-metin { max-width: 640px; font-style: italic; }
  .modulex-deger-vaat-manset-sayfa { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
  .modulex-deger-vaat-manset-sayfa--tek { grid-template-columns: minmax(0, 1fr); }
  .modulex-deger-vaat-manset-lead { position: relative; display: grid; align-content: start; gap: 18px; padding-inline-end: clamp(24px, 4vw, 52px); border-inline-end: 1px solid --cizgi--; }
  .modulex-deger-vaat-manset-sayfa--tek .modulex-deger-vaat-manset-lead { padding-inline-end: 0; border-inline-end: 0; }
  .modulex-deger-vaat-manset-etiket { color: --accentInk--; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-deger-vaat-manset-lbaslik { font-family: var(--mx-font-serif, var(--mx-font-heading, serif)); font-size: clamp(2rem, 4.6vw, 3.8rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .modulex-deger-vaat-manset-lbaslik::before { content: "“"; display: block; color: --accent--; font-size: 1.5em; line-height: 0.7; }
  .modulex-deger-vaat-manset-lbaslik::after { content: ""; display: block; height: 3px; margin-block-start: 16px; background: --accent--; transform-origin: 0 50%; transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }
  [dir="rtl"] .modulex-deger-vaat-manset-lbaslik::after { transform-origin: 100% 50%; }
  .modulex-deger-vaat-manset--hazir:not(.modulex-deger-vaat-manset--gor) .modulex-deger-vaat-manset-lbaslik::after { transform: scaleX(0); }
  .modulex-deger-vaat-manset-gorsel { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .modulex-deger-vaat-manset-lmetin { color: --muted--; font-size: 1.12rem; line-height: 1.8; }
  .modulex-deger-vaat-manset-lmetin::first-line { color: --text--; font-weight: 700; }
  .modulex-deger-vaat-manset-kenar { display: grid; align-content: start; padding-inline-start: clamp(24px, 4vw, 52px); }
  .modulex-deger-vaat-manset-haber { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding-block: 20px; border-block-end: 1px solid --cizgi--; transition: opacity 0.6s ease calc(var(--i) * 0.1s), transform 0.6s ease calc(var(--i) * 0.1s); }
  .modulex-deger-vaat-manset-haber:first-child { padding-block-start: 0; }
  .modulex-deger-vaat-manset--hazir:not(.modulex-deger-vaat-manset--gor) .modulex-deger-vaat-manset-haber { opacity: 0; transform: translateY(14px); }
  .modulex-deger-vaat-manset-hno { color: --accentInk--; font-family: var(--mx-font-serif, var(--mx-font-heading, serif)); font-size: 2.2rem; font-style: italic; font-weight: 700; line-height: 1; transition: transform 0.3s ease; }
  .modulex-deger-vaat-manset-haber:hover .modulex-deger-vaat-manset-hno { transform: translateY(-3px); }
  .modulex-deger-vaat-manset-hyazi { display: grid; gap: 6px; }
  .modulex-deger-vaat-manset-ikon { color: --accentInk--; font-size: 22px; }
  .modulex-deger-vaat-manset-kbaslik { font-family: var(--mx-font-serif, var(--mx-font-heading, serif)); font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
  .modulex-deger-vaat-manset-kmetin { color: --muted--; font-size: 0.95rem; }
  @media (max-width: 1024px) {
    .modulex-deger-vaat-manset-sayfa { grid-template-columns: minmax(0, 1fr); }
    .modulex-deger-vaat-manset-lead { padding-inline-end: 0; padding-block-end: 28px; border-inline-end: 0; border-block-end: 1px solid --cizgi--; }
    .modulex-deger-vaat-manset-kenar { padding-inline-start: 0; padding-block-start: 22px; }
  }
  .modulex-deger-vaat-manset-bag { color: inherit; text-decoration: none; }
  .modulex-deger-vaat-manset-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-vaat-manset-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-vaat-manset :is(.modulex-deger-vaat-manset-baslik, .modulex-deger-vaat-manset-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-vaat-manset-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-deger-vaat-manset { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-vaat-manset *, .modulex-deger-vaat-manset *::before, .modulex-deger-vaat-manset *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-vaat-manset";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
