<footer class="modulex-alt-cekmece{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-alt-cekmece-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>

<style>
  /* alt-cekmece — Footer varsayılan olarak tek satır kadar yer kaplar, ayrıntı isteyene çekmece açılır: kısa sayfalı küçük işletmelerde ekranı doldurmayan, yine de tam bilgili kapanış. */
  .modulex-alt-cekmece { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-alt-cekmece *, .modulex-alt-cekmece *::before, .modulex-alt-cekmece *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-alt-cekmece :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-alt-cekmece :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-alt-cekmece :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-alt-cekmece :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-alt-cekmece img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-alt-cekmece) img { height: auto; }
  .modulex-alt-cekmece [hidden] { display: none !important; }
  .modulex-alt-cekmece :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-alt-cekmece :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-alt-cekmece-ic { max-width: --max--; margin-inline: auto; }
  .modulex-alt-cekmece-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-alt-cekmece--bassiz .modulex-alt-cekmece-bas { display: none; }
  .modulex-alt-cekmece-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-alt-cekmece-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-alt-cekmece-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-alt-cekmece-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-alt-cekmece-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-alt-cekmece-dugme:hover { transform: translateY(-2px); }
  .modulex-alt-cekmece-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-alt-cekmece-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-alt-cekmece-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-alt-cekmece-bag { color: inherit; text-decoration: none; transition: color 0.2s ease; }
  .modulex-alt-cekmece-bag:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-alt-cekmece-bag[aria-current="page"] { color: --accentInk--; font-weight: 700; }
  .modulex-alt-cekmece-logo { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .modulex-alt-cekmece-logo img { width: auto; max-height: --logoH--; }
  .modulex-alt-cekmece-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-alt-cekmece-bbaslik { margin-block-end: 14px; color: --accentInk--; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-alt-cekmece-sayfalar, .modulex-alt-cekmece-baglantilar, .modulex-alt-cekmece-iletisim, .modulex-alt-cekmece-yasal { display: grid; gap: 9px; }
  .modulex-alt-cekmece-il { display: flex; align-items: flex-start; gap: 10px; }
  .modulex-alt-cekmece-il-ic { display: grid; gap: 2px; }
  .modulex-alt-cekmece-il-etiket { color: --muted--; font-size: 0.8rem; }
  .modulex-alt-cekmece-il-ikon { flex: none; color: --accentInk--; font-size: 20px; }
  .modulex-alt-cekmece-saatler { display: grid; gap: 6px; }
  .modulex-alt-cekmece-saat { display: flex; justify-content: space-between; gap: 16px; }
  .modulex-alt-cekmece-saat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .modulex-alt-cekmece-sosyal { display: flex; flex-wrap: wrap; gap: 10px; }
  .modulex-alt-cekmece-sosyal-a { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 1px solid --cizgi--; border-radius: 50%; color: inherit; font-size: 18px; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease; }
  .modulex-alt-cekmece-sosyal-a:hover { border-color: --accent--; background: --accent--; color: --accentText--; transform: translateY(-2px); }
  .modulex-alt-cekmece-hakkinda { max-width: 46ch; color: --muted--; }
  .modulex-alt-cekmece-telif { display: flex; flex-wrap: wrap; gap: 4px 14px; color: --muted--; font-size: 0.9rem; }
  .modulex-alt-cekmece-dil:empty { display: none; }
  .modulex-alt-cekmece-yukari { display: inline-grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 50%; background: --accent--; color: --accentText--; text-decoration: none; transition: transform 0.25s ease; }
  .modulex-alt-cekmece-yukari:hover { transform: translateY(-3px); }
  .modulex-alt-cekmece-bulten { display: grid; gap: 8px; }
  .modulex-alt-cekmece-nl-etiket { font-size: 0.9rem; font-weight: 700; }
  .modulex-alt-cekmece-nl-satir { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-alt-cekmece-nl-girdi { flex: 1 1 200px; min-width: 0; min-height: 48px; padding: 10px 18px; border: 1px solid --cizgi--; border-radius: 999px; background: --bg--; color: --text--; font: inherit; }
  .modulex-alt-cekmece-nl-dugme { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 10px 22px; border: 0; border-radius: 999px; background: --accent--; color: --accentText--; font: inherit; font-weight: 700; transition: transform 0.2s ease; }
  .modulex-alt-cekmece-nl-dugme:hover { transform: translateY(-2px); }
  .modulex-alt-cekmece-nl-dugme .material-symbols-outlined { font-size: 18px; }
  .modulex-alt-cekmece-nl-durum:empty { display: none; }
  .modulex-alt-cekmece-nl-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .modulex-alt-cekmece-nl-metin { color: --muted--; }

  .modulex-alt-cekmece-cm-cubuk { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px 40px; padding-block-end: 22px; }
  .modulex-alt-cekmece-cm-sayfalar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; font-weight: 700; }
  .modulex-alt-cekmece-cm-cek { border-block: 1px solid --cizgi--; }
  .modulex-alt-cekmece-cm-kol { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 58px; color: --accentInk--; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.14em; list-style: none; text-transform: uppercase; transition: background-color 0.25s ease; }
  .modulex-alt-cekmece-cm-kol::-webkit-details-marker { display: none; }
  .modulex-alt-cekmece-cm-kol:hover { background-color: color-mix(in srgb, --accent-- 7%, transparent); }
  .modulex-alt-cekmece-cm-kol-ikon { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: --accent--; color: --accentText--; font-size: 22px; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-alt-cekmece-cm-cek[open] .modulex-alt-cekmece-cm-kol-ikon { transform: rotate(180deg); }
  .modulex-alt-cekmece-cm-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 28px 40px; padding-block: 28px 34px; animation: modulex-alt-cekmece-cm-ac 0.4s ease both; }
  @keyframes modulex-alt-cekmece-cm-ac { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .modulex-alt-cekmece-cm-nl { display: grid; gap: 10px; }
  .modulex-alt-cekmece-cm-nl .modulex-alt-cekmece-nl-baslik { font-size: 1.2rem; }
  .modulex-alt-cekmece-cm-hak { grid-column: 1 / -1; max-width: 70ch; color: --muted--; font-size: 0.95rem; }
  .modulex-alt-cekmece-cm-son { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block-start: 22px; }
  .modulex-alt-cekmece-cm-yasal { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9rem; }
  @media (max-width: 1024px) {
    .modulex-alt-cekmece-cm-cubuk { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  }
  @media (max-width: 768px) {
    .modulex-alt-cekmece-cm-son { justify-content: center; text-align: center; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-cekmece :is(.modulex-alt-cekmece-baslik, .modulex-alt-cekmece-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-cekmece-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-alt-cekmece { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-alt-cekmece *, .modulex-alt-cekmece *::before, .modulex-alt-cekmece *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-alt-cekmece";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const form = (s, P) => {
        s.querySelectorAll("form[data-fb-form]").forEach((f) => {
          const durum = f.querySelector("[role=status]");
          const yaz = (m, hata) => { if (durum) { durum.textContent = m || ""; durum.classList.toggle(P + "-durum--hata", !!hata); } };
          let t0 = Date.now();
          const al = (ad) => { const e = f.elements.namedItem(ad); return e && "value" in e ? String(e.value).trim() : ""; };
          const etiket = (ad) => { const e = f.elements.namedItem(ad); const l = e && e.id ? f.querySelector(`label[for="${e.id}"]`) : null; return l ? l.textContent.trim() : ad; };
          const konuMetin = () => { const e = f.elements.namedItem("topic"); return e && e.selectedIndex > 0 ? e.options[e.selectedIndex].text.trim() : ""; };
          f.addEventListener("submit", (e) => {
            e.preventDefault();
            if (!f.checkValidity()) { f.reportValidity(); return; }
            if (al("website")) return;
            const govde = ["name", "email", "phone"].filter(al).map((k) => `${etiket(k)}: ${al(k)}`)
              .concat(konuMetin() ? [`${etiket("topic")}: ${konuMetin()}`] : [], al("message") ? ["", al("message")] : []).join("\n");
            const d = f.dataset;
            if (d.action) {
              const b = f.querySelector("[type=submit]");
              if (b) b.disabled = true;
              const yuk = { name: al("name"), email: al("email"), phone: al("phone"), topic: konuMetin(), message: al("message"), kvkk: true, lang: document.documentElement.lang || "", page: location.pathname, website: al("website"), t: Date.now() - t0 };
              fetch(d.action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(yuk) })
                .then((r) => r.json().catch(() => ({})).then((j) => r.ok && j && j.ok !== false))
                .then((ok) => { if (b) b.disabled = false; yaz(ok ? d.ok : d.hata, !ok); if (ok) { f.reset(); t0 = Date.now(); } })
                .catch(() => { if (b) b.disabled = false; yaz(d.hata, true); });
              return;
            }
            if (d.gonderim === "whatsapp" && d.wa) { window.open(`https://wa.me/${d.wa}?text=${encodeURIComponent(govde)}`, "_blank", "noopener"); return; }
            if (d.eposta) {
              const konu = [d.konu || "", konuMetin()].filter(Boolean).join(" - ");
              location.href = `mailto:${d.eposta}?subject=${encodeURIComponent(konu)}&body=${encodeURIComponent(govde.replace(/\n/g, "\r\n"))}`;
            }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      form(s, P, az);
    });
  })();
</script>
